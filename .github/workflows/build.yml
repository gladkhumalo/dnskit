name: Build

# The package build that release.yml and testpypi.yml both use, so PyPI and TestPyPI get
# exactly the same checks. It builds the wheel and source archive, checks them with
# twine, installs the wheel in a fresh venv and runs it, then uploads them as the "dist"
# artifact for the calling workflow's publishing jobs.
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag or commit to build (default: the one that triggered the run)."
        type: string
        default: ""
      tag:
        description: If set, the build fails unless this tag is "v" + the pyproject.toml version.
        type: string
        default: ""
    outputs:
      version:
        description: The version in pyproject.toml.
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false  # nothing here pushes to the repository
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read the version from pyproject.toml
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version $version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        # build, twine and the build backend from the hash-locked build.txt; --no-isolation
        # builds with that hatchling instead of downloading one.
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation
          twine check --strict dist/*
      - name: Check the wheel installs and runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/try
          # Unlocked on purpose: dependencies resolve fresh, as they do for anyone installing
          # dnskit, so this catches a release that doesn't work with them.
          /tmp/try/bin/pip install dist/*.whl
          test "$(/tmp/try/bin/dnskit --version)" = "dnskit $VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

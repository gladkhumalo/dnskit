name: Build

# The package build that release.yml and testpypi.yml both use, so PyPI and TestPyPI get
# exactly the same checks. It builds the wheel and source archive, checks them with
# twine, installs the wheel in a fresh venv and runs it, then uploads them as the "dist"
# artifact for the calling workflow's publishing jobs.
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag or commit to build (default: the one that triggered the run)."
        type: string
        default: ""
      tag:
        description: If set, the build fails unless this tag is "v" + the pyproject.toml version.
        type: string
        default: ""
    outputs:
      version:
        description: The version in pyproject.toml.
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the version from pyproject.toml
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version $version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check the wheel installs and runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          test "$(/tmp/try/bin/dnskit --version)" = "dnskit $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

name: CI

# Every push (any branch) and every pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    # A push to a branch of this repository already runs the checks, so its pull request
    # doesn't run them a second time. Pull requests from forks still do.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    # All three systems: resolver discovery, adapters and some error codes are OS-specific,
    # and mypy only checks each platform's own branch of adapters.py on that platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes to the repository
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/requirements/dev.txt
      - name: Install
        # The tools and dnskit's dependencies from the hash-locked dev.txt (pip refuses
        # anything not in it), then dnskit itself, editable, without downloading anything.
        run: |
          python -m pip install --require-hashes -r .github/requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests with coverage
        run: pytest -v --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

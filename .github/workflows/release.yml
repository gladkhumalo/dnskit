name: Release

# Pushing a version tag (git tag -a v0.1.0 -m "dnskit 0.1.0" && git push origin v0.1.0):
#   1. build    — build.yml: the tag must match the version; build, check, install, run.
#   2. github   — a GitHub Release with that version's CHANGELOG.md section as its notes
#                 and the wheel and source archive attached.
#   3. pypi     — only after the GitHub Release exists: upload the same files to PyPI with
#                 Trusted Publishing (no API token). It runs in the "pypi" environment, so
#                 it waits for a reviewer's approval if the environment requires one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}

  github:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$VERSION" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "dnskit $VERSION" \
            --notes-file release-notes.md \
            --verify-tag

  pypi:
    name: Publish to PyPI
    needs: [build, github]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dnskit/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing: PyPI accepts this job's OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

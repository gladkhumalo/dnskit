name: Release

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds the package and
# creates a GitHub Release with that version's CHANGELOG.md section as its notes and the
# wheel and source archive attached. It doesn't publish to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the version in pyproject.toml
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$VERSION" > release-notes.md
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          test "$(/tmp/try/bin/dnskit --version)" = "dnskit $VERSION"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "dnskit $VERSION" \
            --notes-file release-notes.md \
            --verify-tag

name: TestPyPI

# Run by hand (Actions → TestPyPI → Run workflow) to try a release on test.pypi.org before
# tagging it: the same build as release.yml (build.yml), uploaded with Trusted Publishing
# in the "testpypi" environment, then installed back from TestPyPI and run.
#
# It builds the branch chosen under "Use workflow from". There's deliberately no input for
# another ref: building code from one ref while running as another (say main) would run that
# code with the other ref's cache access, so a branch could poison main's cache.
#
# TestPyPI never accepts the same version twice, so a version that's already there is
# skipped rather than failing the run; the install check then tests the copy already there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dnskit/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing: TestPyPI accepts this job's OIDC token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  check:
    name: Install from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install from TestPyPI and run
        # Only dnskit itself comes from TestPyPI (anyone can upload anything there); its
        # dependencies come from the real PyPI. A new upload can take a minute to appear.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if pip download --no-deps --index-url https://test.pypi.org/simple/ \
                "dnskit==$VERSION" -d testpypi; then
              break
            fi
            sleep 20
          done
          python -m venv /tmp/try
          # The only file in testpypi/ is the wheel downloaded above. Its dependencies resolve
          # fresh from PyPI, as they do for anyone installing dnskit.
          /tmp/try/bin/pip install testpypi/*.whl
          test "$(/tmp/try/bin/dnskit --version)" = "dnskit $VERSION"
          /tmp/try/bin/dnskit lookup example.com

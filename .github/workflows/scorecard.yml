name: Scorecard supply-chain security

# OpenSSF Scorecard checks this repository's security practices and publishes the results to
# api.scorecard.dev (for the README badge) and to the Security tab (code scanning). Based on
# ossf/scorecard-action's examples/scorecard.yml for public repositories.
#
# With publish_results: true, the Scorecard API rejects results unless the workflow follows
# its rules: no workflow-level env, defaults or write permissions, and the analysis job only
# runs approved actions (checkout, upload-artifact, codeql upload-sarif, scorecard-action,
# harden-runner) on an Ubuntu runner, with no run steps, env, services or containers. Keep
# this job to these steps. See https://github.com/ossf/scorecard-action#workflow-restrictions
on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check up to date.
  schedule:
    - cron: "15 14 * * 0"  # Sundays, 14:15 UTC
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

# Blocks all cache access (added to GitHub Actions in September 2026; actionlint 1.7.12 and
# earlier report it as an unexpected key). See
# https://github.com/ossf/scorecard-action#workflow-linters
cache-mode: none

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write  # upload the SARIF results to code scanning
      id-token: write  # sign the results published to api.scorecard.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Fail if the Scorecard API rejects the results (network errors and 5xx stay
          # warnings). See https://github.com/ossf/scorecard-action#when-publishing-fails
          fail_on_publish_error: true

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnskit"
version = "0.1.0"
description = "A command-line DNS troubleshooting toolkit that explains what it finds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Glad Khumalo" }]
keywords = ["dns", "dnssec", "spf", "dmarc", "dkim", "troubleshooting", "cli", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "dnspython[dnssec]>=2.6",  # [dnssec]: cryptography, to verify signatures
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/gladkhumalo/dnskit"
Documentation = "https://github.com/gladkhumalo/dnskit/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/gladkhumalo/dnskit/issues"

[project.scripts]
dnskit = "dnskit.cli.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dnskit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # pyupgrade (Python 3.11+ syntax)
    "B",        # bugbear
    "SIM",      # simplifications
    "C4",       # comprehensions
    "RUF",      # ruff's own rules
    "PIE",      # misc. lints
    "PT",       # pytest style
    "T20",      # no print(): output goes through Rich in the CLI only
    "RET",      # return statements
    "PTH",      # pathlib over os.path
    "PERF",     # performance
    "FURB",     # refurb
    "TID",      # banned imports (below)
]
ignore = [
    "PT018",    # `assert a and b` reads fine in tests
]
# The en dash is deliberate typography in messages ("1–65535", "– no IPv6 route").
allowed-confusables = ["–"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Core never prints or imports UI libraries: the planned web UI reuses it as is.
"rich".msg = "core must not import rich: rendering belongs in dnskit.cli"
"typer".msg = "core must not import typer: argument parsing belongs in dnskit.cli"

[tool.ruff.lint.per-file-ignores]
"src/dnskit/cli/**" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]   # developer tools, like the CLI, may use rich

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dnskit"]
branch = true

[tool.coverage.report]
show_missing = true
# CI fails if coverage drops below this. Core is ~99%; the CLI's rendering branches are the rest.
fail_under = 95
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
]

[tool.mypy]
# The package is fully typed and checked strictly. CI runs this on Windows, macOS and Linux,
# since some code (adapters.py) only type-checks on its own platform.
files = ["src"]
python_version = "3.11"
strict = true
